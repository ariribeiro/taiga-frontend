# MODELO. Não commite o arquivo com valores reais: crie o Secret direto no cluster, por exemplo:
#   oc create secret generic taiga-dev-view-front --from-literal=API_KEY='<o mesmo INTERNAL_API_KEY do back>'
apiVersion: v1
kind: Secret
metadata:
  name: taiga-dev-view-front
  labels: { app: taiga-dev-view-front }
type: Opaque
stringData:
  API_KEY: "o-mesmo-INTERNAL_API_KEY-do-back"
